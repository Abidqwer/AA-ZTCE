{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              aa-ztce-client: "true"
      ports:
        - protocol: TCP
          port: 8443
  egress: {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
